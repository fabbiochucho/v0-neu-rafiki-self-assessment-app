name: CI

on:
  pull_request:
  push:
    branches: [main]

# Note: no Playwright/e2e job here on purpose. tests/e2e/** specs need
# seeded question-bank fixture data and a disposable test account, which
# this repo's real (production) credentials below aren't set up for --
# they run locally/against a staging environment instead.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Real credentials, pulled from this repo's GitHub Actions secrets
      # (Settings > Secrets and variables > Actions) -- the actual production
      # Supabase project, encryption key, and federation values. CI only runs
      # typecheck/build/unit tests (no e2e, no live network calls), but treat
      # this workflow file with the same care as production config since
      # real secrets flow through it.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ASSESSMENT_ENCRYPTION_KEY: ${{ secrets.ASSESSMENT_ENCRYPTION_KEY }}
      # Phase 1 federation (optional feature). The federation keypair here is
      # a CI-only pair, deliberately separate from the real production
      # keypair in Vercel, to limit blast radius if these CI secrets ever
      # leak -- CI never performs a real handshake, it only needs *a*
      # validly-shaped key pair to satisfy build-time parsing.
      NEXT_PUBLIC_ALLIANCE_APP_URL: ${{ secrets.NEXT_PUBLIC_ALLIANCE_APP_URL }}
      FEDERATION_PRIVATE_KEY: ${{ secrets.FEDERATION_PRIVATE_KEY }}
      FEDERATION_ALLIANCE_PUBLIC_KEY: ${{ secrets.FEDERATION_ALLIANCE_PUBLIC_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build (runs ESLint, including jsx-a11y, as part of next build)
        run: pnpm build

      - name: Unit tests
        run: pnpm exec vitest run
